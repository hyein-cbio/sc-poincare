name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"

jobs:
  full-suite:
    name: Python ${{ matrix.python }} / Scanpy ${{ matrix.scanpy }} (CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CPU_TORCH: 2.14.1+cpu
      CI_CONSTRAINTS: ${{ github.workspace }}/.github/ci/constraints-${{ matrix.lane }}.txt
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lane: py312-scanpy112, python: "3.12", scanpy: "1.12.4"}
          - {lane: py314-scanpy112, python: "3.14", scanpy: "1.12.4"}
          - {lane: py314-scanpy113, python: "3.14", scanpy: "1.13.0"}
          - {lane: py310-scanpy111, python: "3.10", scanpy: "1.11.5"}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned build tooling and CPU Torch
        run: |
          python -m pip install --only-binary=:all: -c "$CI_CONSTRAINTS" build hatchling pytest
          python -m pip install --only-binary=:all: --no-deps -c "$CI_CONSTRAINTS" \
            --index-url https://download.pytorch.org/whl/cpu "torch==$CPU_TORCH"
      - name: Build and install wheel with the lane constraints
        run: |
          python -m build --wheel --no-isolation --outdir "$RUNNER_TEMP/wheel"
          wheel=$(find "$RUNNER_TEMP/wheel" -name '*.whl' -print -quit)
          test -n "$wheel"
          python -m pip install --only-binary=:all: -c "$CI_CONSTRAINTS" "${wheel}[benchmark,scanpy,torch]"
          python -m pip check
      - name: Run Scanpy and numerical contracts against the installed wheel
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_PYTHON: ${{ matrix.python }}
          EXPECTED_SCANPY: ${{ matrix.scanpy }}
        run: |
          cp "$GITHUB_WORKSPACE/.github/ci/check_installed_wheel.py" .
          python -I check_installed_wheel.py --source-root "$GITHUB_WORKSPACE" \
            --python "$EXPECTED_PYTHON" --scanpy "$EXPECTED_SCANPY" --torch "$CPU_TORCH" \
            --output "$RUNNER_TEMP/wheel-check/numeric-contract.json"
      - uses: actions/upload-artifact@v4
        with:
          name: numeric-${{ matrix.lane }}
          path: ${{ runner.temp }}/wheel-check/numeric-contract.json
          if-no-files-found: error
      - name: Run active synthetic suite (no private datasets)
        run: python -m pytest tests
      - name: Check historical examples explicitly (tiny synthetic inputs only)
        run: python -m pytest examples/historical/tests

  compare-wheel-contracts:
    name: Compare numerical contracts across environments
    needs: full-suite
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: numeric-*
          path: ${{ runner.temp }}/numeric-contracts
      - run: python -I .github/ci/compare_numeric_contracts.py "$RUNNER_TEMP/numeric-contracts"

  numpy-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned core without optional Torch or Scanpy
        run: |
          constraints=.github/ci/constraints-modern.txt
          python -m pip install --only-binary=:all: -c "$constraints" hatchling pytest
          python -m pip install --no-build-isolation --only-binary=:all: -c "$constraints" ".[benchmark]"
          python -m pip check
      - name: Check Torch-free geometry, graph and evaluation paths
        run: |
          python -c "from importlib.util import find_spec; assert find_spec('torch') is find_spec('scanpy') is None"
          python -m pytest tests/test_geometry.py tests/test_proximity.py tests/test_graph_modes.py tests/test_evaluation.py tests/test_evaluation_comparison.py tests/test_visibility.py tests/test_graph_visibility_cli.py tests/test_graph_stress.py tests/test_euclidean_evaluation.py tests/test_mu_study.py tests/test_mu_summary.py tests/test_mu_default_api.py tests/test_graph_topology_diagnostics.py tests/test_scanpy_demo_methods.py tests/test_legacy_display.py tests/test_rfa_controls.py tests/test_gene_order_diagnostics.py tests/test_teacher_diagnostics.py tests/test_research_containment.py tests/test_landmark_reference.py tests/test_controlled_probe.py
